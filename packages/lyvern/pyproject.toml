[project]
name = "lyvern"
version = "0.0.0"
description = "Shared core: configuration, logging, database, task queue, review engine, CLI."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyjwt[crypto]>=2.15.1",
    "tree-sitter>=0.26.1",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-go>=0.25.0",
]

[project.scripts]
lyvern = "lyvern.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lyvern"]
