[alembic]
script_location = packages/lyvern/src/lyvern/db/migrations
prepend_sys_path = packages/lyvern/src
file_template = %%(rev)s_%%(slug)s

# The database URL is read from LYVERN_DATABASE_URL in env.py, never stored here.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
