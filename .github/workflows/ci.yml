name: CI

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: printel
          POSTGRES_PASSWORD: printel
          POSTGRES_DB: printel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U printel -d printel" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      PRINTEL_ENVIRONMENT: test
      PRINTEL_DATABASE_URL: postgresql+psycopg://printel:printel@localhost:5432/printel
      PRINTEL_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - name: Start worker
        run: |
          nohup uv run celery -A printel_worker.app worker --loglevel=INFO > worker.log 2>&1 &
          sleep 10
      - run: uv run pytest tests -q
      - name: Worker log on failure
        if: failure()
        run: tail -n 50 worker.log || true

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
