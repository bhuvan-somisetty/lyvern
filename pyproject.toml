[project]
name = "lyvern-workspace"
version = "0.0.0"
description = "Workspace root for the pull request intelligence platform."
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["packages/lyvern", "apps/api", "apps/worker"]

[tool.uv.sources]
lyvern = { workspace = true }
lyvern-api = { workspace = true }
lyvern-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "lyvern",
    "lyvern-api",
    "lyvern-worker",
    "hypothesis>=6.170.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/lyvern/src", "apps/api/src", "apps/worker/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
# the rule table holds long tree-sitter queries and descriptions: data, not logic
"packages/lyvern/src/lyvern/engine/analyzers/js_ts.py" = ["E501"]
# report text and docstrings with long sentences
"packages/lyvern/src/lyvern/benchmark/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["packages/lyvern/src", "apps/api/src", "apps/worker/src"]

[[tool.mypy.overrides]]
module = ["celery.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs running Postgres and Redis (docker compose up -d db redis)"]
