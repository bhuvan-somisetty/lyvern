[project]
name = "lyvern-worker"
version = "0.0.0"
description = "Background worker entry point (Celery)."
requires-python = ">=3.12,<3.13"
dependencies = ["lyvern"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lyvern_worker"]
