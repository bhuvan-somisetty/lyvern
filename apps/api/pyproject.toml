[project]
name = "lyvern-api"
version = "0.0.0"
description = "HTTP API (FastAPI)."
requires-python = ">=3.12,<3.13"
dependencies = ["lyvern", "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lyvern_api"]
