name: lyvern

x-python: &python
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile.python
  environment: &python-env
    LYVERN_ENVIRONMENT: dev
    LYVERN_DATABASE_URL: postgresql+psycopg://lyvern:lyvern@db:5432/lyvern
    LYVERN_REDIS_URL: redis://redis:6379/0
    # GitHub App and optional switches come from your shell or the .env file next to this file
    LYVERN_GITHUB_APP_ID: ${LYVERN_GITHUB_APP_ID:-}
    LYVERN_GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
    LYVERN_GITHUB_WEBHOOK_SECRET: ${LYVERN_GITHUB_WEBHOOK_SECRET:-}
    LYVERN_WRITE_ALLOWED_REPOS: ${LYVERN_WRITE_ALLOWED_REPOS:-bhuvan-somisetty/lyvern-sandbox}
    LYVERN_APPROVE_ALLOWED_REPOS: ${LYVERN_APPROVE_ALLOWED_REPOS:-}
    LYVERN_DEPENDENCY_CHECK: ${LYVERN_DEPENDENCY_CHECK:-}
    LYVERN_LLM_PROVIDER: ${LYVERN_LLM_PROVIDER:-}
    LYVERN_GROQ_API_KEY: ${LYVERN_GROQ_API_KEY:-}
    LYVERN_GEMINI_API_KEY: ${LYVERN_GEMINI_API_KEY:-}
    LYVERN_API_TOKEN: ${LYVERN_API_TOKEN:-}
  volumes:
    # path of the App's private key file on THIS computer (never inside the repository)
    - ${LYVERN_GITHUB_APP_PRIVATE_KEY_HOST_PATH:-/dev/null}:/run/secrets/github-app.pem:ro

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lyvern
      POSTGRES_PASSWORD: lyvern
      POSTGRES_DB: lyvern
    ports: ["${LYVERN_DB_PORT:-5433}:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyvern -d lyvern"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${LYVERN_REDIS_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *python
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *python
    command: ["uvicorn", "lyvern_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["${LYVERN_API_PORT:-8000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *python
    command: ["celery", "-A", "lyvern_worker.app", "worker", "--loglevel=INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A lyvern_worker.app inspect ping -d celery@$$HOSTNAME"]
      interval: 15s
      timeout: 10s
      retries: 6

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    environment:
      LYVERN_API_URL: http://api:8000
      LYVERN_API_TOKEN: ${LYVERN_API_TOKEN:-}
      LYVERN_SESSION_SECRET: ${LYVERN_SESSION_SECRET:-}
      LYVERN_DASHBOARD_PASSWORD: ${LYVERN_DASHBOARD_PASSWORD:-}
    ports: ["${LYVERN_WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  dbdata:
