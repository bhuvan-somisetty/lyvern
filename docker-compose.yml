name: pr-intel

x-python: &python
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile.python
  environment: &python-env
    PRINTEL_ENVIRONMENT: dev
    PRINTEL_DATABASE_URL: postgresql+psycopg://printel:printel@db:5432/printel
    PRINTEL_REDIS_URL: redis://redis:6379/0

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: printel
      POSTGRES_PASSWORD: printel
      POSTGRES_DB: printel
    ports: ["${PRINTEL_DB_PORT:-5433}:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printel -d printel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${PRINTEL_REDIS_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *python
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *python
    command: ["uvicorn", "printel_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["${PRINTEL_API_PORT:-8000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *python
    command: ["celery", "-A", "printel_worker.app", "worker", "--loglevel=INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A printel_worker.app inspect ping -d celery@$$HOSTNAME"]
      interval: 15s
      timeout: 10s
      retries: 6

volumes:
  dbdata:
